name: Publish to npm

# Triggers when a version tag is pushed (e.g. `v0.1.0`, `v1.2.3`).
# Runs the full pipeline (typecheck, tests, build) and then publishes
# the package to npm with provenance attestations.
#
# Setup required (one-time, when the repo is first created):
# 1. Add this repository/workflow as a trusted publisher for the
#    `canon-signal` package in npm.
# 2. Keep `id-token: write` below so GitHub can exchange an OIDC token
#    with npm during `npm publish --provenance`.
# 3. Keep npm at 11.5.1 or newer; trusted publishing depends on npm's
#    OIDC exchange support.
# 4. No NPM_TOKEN secret is required for this workflow.
#
# Releasing a new version:
# 1. Update the version in package.json
# 2. Update CHANGELOG.md
# 3. Commit the changes
# 4. Create and push a tag: `git tag v0.1.0 && git push origin v0.1.0`
# 5. The workflow runs automatically.
#
# Manual trigger via workflow_dispatch is also supported for emergency releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        type: boolean
        default: false

# Provenance requires id-token: write so OIDC can sign the build.
# contents: read is needed to check out the repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # This Node version builds and publishes the package; it
          # doesn't constrain consumers.
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version matches: $PKG_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run --access public --provenance

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public --provenance
